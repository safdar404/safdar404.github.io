<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">GeoAI Site Intelligence Suite — three spatial decision workflows</title>
<desc id="desc">A portfolio overview showing the weighted suitability model and the three applications: Meridian Pro, GeoSentinel Pro, and Solaris Pro. This is an interface schematic, not measured site results.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#091622"/><stop offset="1" stop-color="#133246"/></linearGradient><linearGradient id="accent"><stop stop-color="#25d8e7"/><stop offset="1" stop-color="#80e0ac"/></linearGradient><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#285162" stroke-width=".6"/></pattern></defs>
<rect width="1200" height="610" rx="20" fill="url(#bg)"/><rect width="1200" height="610" rx="20" fill="url(#grid)" opacity=".4"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="48" y="54" font-size="15" fill="#43d5e4" letter-spacing="3">FEATURED GEOAI PROJECT</text><text x="48" y="101" font-size="38" font-weight="700" fill="#f6fbff">GeoAI Site Intelligence Suite</text><text x="48" y="132" font-size="17" fill="#a9c3ce">Three interactive spatial decision-support prototypes · MCDA · candidate ranking</text>
<rect x="48" y="166" width="1104" height="278" rx="15" fill="#0d2432" stroke="#376071"/>
<g transform="translate(68 188)"><text y="0" fill="#c6dbe3" font-size="13" font-weight="700" letter-spacing="1">ANALYTICAL MODEL</text><text y="35" fill="#ffffff" font-size="17" font-weight="700">Criteria → normalized scores → weighted suitability → ranked sites</text>
<g font-size="13" fill="#d8e8ee"><rect y="58" width="198" height="76" rx="10" fill="#183848" stroke="#2d7d91"/><text x="16" y="87">Spatial context</text><text x="16" y="111" fill="#8fc7d4">terrain · access · hazard</text><rect x="223" y="58" width="198" height="76" rx="10" fill="#183848" stroke="#2d7d91"/><text x="239" y="87">Scenario weights</text><text x="239" y="111" fill="#8fc7d4">adjustable criteria</text><rect x="446" y="58" width="198" height="76" rx="10" fill="#183848" stroke="#2d7d91"/><text x="462" y="87">Composite surface</text><text x="462" y="111" fill="#8fc7d4">relative suitability</text><rect x="669" y="58" width="198" height="76" rx="10" fill="#183848" stroke="#2d7d91"/><text x="685" y="87">Candidate shortlist</text><text x="685" y="111" fill="#8fc7d4">score · location · factors</text><rect x="892" y="58" width="192" height="76" rx="10" fill="#183848" stroke="#2d7d91"/><text x="908" y="87">Decision review</text><text x="908" y="111" fill="#8fc7d4">map · export · validate</text></g>
<path d="M201 96h20m203 0h20m203 0h20m203 0h20" stroke="#66d6d5" stroke-width="3"/>
<text y="173" fill="#9db7c3" font-size="13">Illustrative workflow; scores depend on scenario inputs and require local data validation.</text></g>
