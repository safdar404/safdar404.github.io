name: Sync profile and publish portfolio
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: portfolio-pages
  cancel-in-progress: false
jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read canonical profile and regenerate portfolio
        run: python scripts/sync_profile.py
      - name: Save synchronized content
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html README.md profile-source.md
          if ! git diff --cached --quiet; then
            git commit -m 'Synchronize portfolio from GitHub profile'
            git push
          fi
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir /tmp/portfolio-site
          rsync -a --exclude='.git' --exclude='.github' --exclude='scripts' ./ /tmp/portfolio-site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/portfolio-site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
