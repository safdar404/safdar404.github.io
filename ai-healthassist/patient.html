<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI-HealthAssist | Patient Assessment</title><style>body{margin:0;background:#06110e;color:#eef8f3;font:15px Arial;padding:40px}main{max-width:850px;margin:auto}h1{font-size:46px}section{background:#0d1c18;border:1px solid #1c3931;border-radius:16px;padding:25px;margin:20px 0}input{padding:11px;background:#071310;border:1px solid #1c3931;color:white;border-radius:7px;width:100%;box-sizing:border-box}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{padding:13px 18px;background:#69f0b7;border:0;border-radius:8px;font-weight:bold;margin-top:18px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main><p>AI-HEALTHASSIST · PATIENT PORTAL</p><h1>Preliminary Health Assessment</h1><p>Enter synthetic/demo information. This prototype does not diagnose or prescribe.</p><section><div class="grid"><label>Age<input id="age" type="number" value="45"></label><label>Systolic BP<input id="bp" type="number" value="130"></label><label>Diastolic BP<input id="dbp" type="number" value="85"></label><label>BMI<input id="bmi" type="number" value="24"></label></div><button onclick="run()">Run Safety-First Assessment</button></section><section id="out"><b>Result will appear here.</b></section></main><script>async function run(){let data={age:+age.value,systolic_bp:+bp.value,diastolic_bp:+dbp.value,bmi:+bmi.value,smoking:false,symptoms:[]};try{let r=await fetch('http://localhost:8000/assessment/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw 0;show(await r.json())}catch(e){let s=(data.age>=55?18:0)+(data.systolic_bp>=140?18:0)+(data.diastolic_bp>=90?6:0)+(data.bmi>=30?10:data.bmi>=25?6:0);show({triage:s>=60?'HIGH':s>=35?'MODERATE':'LOW',preliminary_score:s,clinical_review_required:true,status:'local-demo'})}}function show(x){out.innerHTML='<h2>'+x.triage+'</h2><p>Preliminary score: '+x.preliminary_score+'%</p><p>Clinical review required: '+x.clinical_review_required+'</p><small>Prototype only — not medical advice.</small>'}</script></body></html>
